{% set version = "1.0.2" %}

package:
  name: spacy-pkuseg
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/spacy-pkuseg/spacy_pkuseg-{{ version }}.tar.gz
  sha256: 20aea9aaece9fcba8e8f295b55b463bf80cd930039a8b600a51346fa73a58697

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - python                                 # [build_platform != target_platform]
  host:
    - cython
    - numpy
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - numpy
    - srsly >=2.3.0,<3.0.0

test:
  imports:
    - spacy_pkuseg
  requires:
    - pytest
    - pip
  commands:
    - pip check
    - python -m pytest -vv --color=yes --tb=native --pyargs spacy_pkuseg

about:
  home: http://github.com/explosion/spacy-pkuseg
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: PKUSeg Chinese word segmentation toolkit for spaCy

extra:
  recipe-maintainers:
    - conda-forge/spacy
